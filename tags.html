<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tags</title>
</head>
<body>
    <p>hai goodmorning</p>
    <p><b>hai</b></p>
    <p><strong>goodmorning</strong></p>
    <p><i>hello</i></p>
    <p><u>haiii</u></p>
    <p><del>hello</del></p>
    <p><mark>hai</mark></p>
    <p>h<sub>2</sub>0</p>
    <p>o<sup>2</sup></p>
    <p>hello<small>hai</small></p>
